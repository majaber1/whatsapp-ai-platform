name: Architecture Runtime Bootstrap

on:
  push:
    branches:
      - architecture/wacrm-langgraph-mcp-groq

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: architecture/wacrm-langgraph-mcp-groq

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Add Groq to AI settings UI
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/settings/ai-config.tsx')
          text = path.read_text()

          replacements = {
              "  anthropic: 'Anthropic (Claude)',\n};": "  anthropic: 'Anthropic (Claude)',\n  groq: 'Groq',\n};",
              "  anthropic: 'sk-ant-...',\n};": "  anthropic: 'sk-ant-...',\n  groq: 'gsk_...',\n};",
              "      model === AI_PROVIDER_DEFAULT_MODEL.anthropic ||\n      model.trim() === '';": "      model === AI_PROVIDER_DEFAULT_MODEL.anthropic ||\n      model === AI_PROVIDER_DEFAULT_MODEL.groq ||\n      model.trim() === '';",
              "                    <SelectItem value=\"anthropic\">\n                      {PROVIDER_LABEL.anthropic}\n                    </SelectItem>": "                    <SelectItem value=\"anthropic\">\n                      {PROVIDER_LABEL.anthropic}\n                    </SelectItem>\n                    <SelectItem value=\"groq\">\n                      {PROVIDER_LABEL.groq}\n                    </SelectItem>",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected AI settings snippet not found: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Document feature-gated runtime
        shell: python
        run: |
          from pathlib import Path
          path = Path('.env.local.example')
          text = path.read_text()
          text = text.replace(
              'OpenAI or Anthropic key under Settings → AI Assistant.',
              'OpenAI, Anthropic, or Groq key under Settings → AI Assistant.',
          )
          marker = '# AI_CONTEXT_MESSAGE_LIMIT=20\n'
          addition = '''\n# LangGraph AI Employee runtime. Keep false/unset until the bounded graph\n# has passed provider + tool + persistence E2E verification. The legacy\n# provider-neutral generation path remains the default.\n# AI_RUNTIME_V2_ENABLED=false\n'''
          if 'AI_RUNTIME_V2_ENABLED' not in text:
              if marker not in text:
                  raise SystemExit('AI env marker not found')
              text = text.replace(marker, marker + addition)
          path.write_text(text)

      - name: Install exact LangGraph dependencies
        run: npm install --save-exact @langchain/langgraph@1.4.14 @langchain/core@1.2.9

      - name: Commit generated dependency lock and UI wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/components/settings/ai-config.tsx .env.local.example
          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit"
            exit 0
          fi
          git commit -m "feat(ai): wire LangGraph dependencies and Groq settings"
          git push origin HEAD:architecture/wacrm-langgraph-mcp-groq
